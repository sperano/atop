name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  web:
    # Pinned: ubuntu-latest is 26.04, where Playwright 1.59 cannot install
    # chromium's dependencies. Move back when playwright is bumped past it.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
      - name: browser for the component tests
        run: npx playwright install --with-deps chromium
      - name: lint
        run: npm run lint
      - name: svelte-check
        run: npm run check
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The webdist build embeds web/dist, which only exists after the build.
      - name: vet and test with the built UI
        working-directory: .
        run: go vet -tags webdist ./... && go test -race -tags webdist ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Both platforms build natively on the runner (no QEMU); nothing is pushed.
      - name: build
        run: docker buildx build --platform linux/amd64,linux/arm64 .
